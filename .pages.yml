media:
  input: public/assets
  output: /assets
  rename: safe
  extensions: [png, jpg, jpeg, webp, avif, svg]

content:
  - name: site
    label: Ustawienia strony
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - { name: name, label: Nazwa, type: string, required: true }
      - { name: description, label: Opis SEO, type: text, required: true }
      - { name: email, label: Publiczny e-mail, type: string }
      - { name: phone, label: Telefon, type: string }
      - { name: location, label: Lokalizacja, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: github, label: GitHub URL, type: string }

  - name: home
    label: Strona główna
    type: file
    path: content/home.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Nadtytuł, type: string, required: true }
          - { name: title, label: Nagłówek, type: string, required: true }
          - { name: accent, label: Niebieska część nagłówka, type: string }
          - { name: lead, label: Opis, type: text, required: true }
          - { name: note, label: Notatka przy obrazie, type: string }
      - name: services
        label: Usługi
        type: object
        fields:
          - { name: title, label: Nagłówek, type: string, required: true }
          - { name: intro, label: Wstęp, type: text, required: true }
          - name: items
            label: Karty usług
            type: object
            list: true
            fields:
              - name: icon
                type: select
                options:
                  values: [workflow, cube, grid, zap, chart, shield]
              - name: slug
                label: Adres podstrony
                type: select
                options:
                  values: [automatyzacja, aplikacje-na-miare, ai, strony-internetowe]
              - { name: title, label: Nazwa usługi, type: string, required: true }
              - { name: description, label: Opis, type: text, required: true }
      - name: about
        label: O mnie
        type: object
        fields:
          - { name: title, label: Nagłówek, type: string, required: true }
          - { name: paragraphs, label: Akapity, type: text, list: true }
          - { name: principles, label: Zasady współpracy, type: string, list: true }
      - name: benefits
        label: Dlaczego warto
        type: object
        fields:
          - { name: title, label: Nagłówek, type: string, required: true }
          - { name: intro, label: Wstęp, type: text, required: true }
          - name: items
            label: Korzyści
            type: object
            list: true
            fields:
              - name: icon
                type: select
                options:
                  values: [clock, chart, user, shield, zap, smile]
              - { name: title, label: Nazwa, type: string, required: true }
              - { name: description, label: Opis, type: text, required: true }
      - name: contact
        label: Kontakt
        type: object
        fields:
          - { name: title, label: Nagłówek, type: string, required: true }
          - { name: intro, label: Wstęp, type: text, required: true }

  - name: portfolio
    label: Strona portfolio
    type: file
    path: content/portfolio.json
    format: json
    operations:
      delete: false
    fields:
      - { name: title, label: Tytuł SEO, type: string, required: true }
      - { name: description, label: Opis SEO, type: text, required: true }
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Nadtytuł, type: string, required: true }
          - { name: title, label: Nagłówek (nowa linia zachowuje podział), type: text, required: true }
          - { name: description, label: Opis, type: text, required: true }
          - { name: image, label: Grafika, type: image, required: true }
          - { name: actionLabel, label: Przycisk kontaktu, type: string, required: true }
          - { name: processLabel, label: Link do procesu, type: string, required: true }
      - name: projects
        label: Projekty
        type: object
        fields:
          - { name: eyebrow, label: Nadtytuł, type: string, required: true }
          - { name: title, label: Nagłówek, type: text, required: true }
          - { name: description, label: Opis, type: text, required: true }
          - { name: emptyText, label: Komunikat pustej kategorii, type: string, required: true }
          - { name: resetLabel, label: Przycisk resetu, type: string, required: true }
      - name: process
        label: Jak pracuję
        type: object
        fields:
          - { name: eyebrow, label: Nadtytuł, type: string, required: true }
          - { name: title, label: Nagłówek, type: text, required: true }
          - name: steps
            label: Kroki współpracy
            type: object
            list: true
            fields:
              - name: icon
                label: Ikona
                type: select
                required: true
                options:
                  values: [pencil-ruler, square-pen, rocket, cube]
              - { name: title, label: Nazwa kroku, type: string, required: true }
              - { name: description, label: Opis, type: text, required: true }
      - name: contact
        label: Końcowe CTA
        type: object
        fields:
          - { name: eyebrow, label: Nadtytuł, type: string, required: true }
          - { name: title, label: Nagłówek, type: string, required: true }
          - { name: description, label: Opis, type: text, required: true }
          - { name: actionLabel, label: Przycisk, type: string, required: true }
          - { name: href, label: Adres kontaktu, type: string, required: true }

  - name: cases
    label: Portfolio — wdrożenia
    type: collection
    path: content/cases
    format: json
    filename: "{primary}.json"
    exclude: [.gitkeep]
    operations:
      rename: false
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: published, label: Opublikowane, type: boolean }
      - { name: order, label: Kolejność, type: number, required: true }
      - { name: category, label: Kategoria, type: string, required: true }
      - { name: summary, label: Opis karty, type: text, required: true }
      - { name: image, label: Obraz, type: image, required: true }
      - name: portfolioCategory
        label: Filtr portfolio
        type: select
        default: website
        required: true
        options:
          values:
            - { name: website, label: Strony internetowe }
            - { name: automation, label: Automatyzacje }
            - { name: web-app, label: Aplikacje }
            - { name: integration, label: Integracje }
      - { name: portfolioImage, label: Makieta na stronie portfolio (opcjonalnie), type: image }
      - { name: portfolioImageAlt, label: Opis alternatywny makiety, type: string }
      - name: imagePresentation
        label: Sposób wyświetlania obrazu
        type: select
        default: cover
        options:
          values:
            - { name: cover, label: Grafika wypełniająca obszar }
            - { name: logo, label: Logo na jasnym tle }
      - { name: externalUrl, label: Adres działającej witryny (opcjonalnie), type: string }
      - { name: result, label: Potwierdzony wynik, type: string }
      - { name: resultLabel, label: Opis wyniku, type: string }
      - name: blocks
        label: Sekcje opisu wdrożenia
        type: object
        list: true
        fields:
          - { name: heading, label: Nagłówek, type: string, required: true }
          - { name: text, label: Tekst, type: text, required: true }

  - name: articles
    label: Artykuły
    type: collection
    path: content/articles
    format: json
    filename: "{primary}.json"
    exclude: [.gitkeep]
    operations:
      rename: false
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: published, label: Opublikowane, type: boolean }
      - { name: order, label: Kolejność na stronie głównej, type: number, required: true }
      - { name: category, label: Kategoria, type: string, required: true }
      - { name: date, label: Data, type: date, required: true }
      - { name: author, label: Autor, type: string, required: true }
      - { name: summary, label: Zajawka, type: text, required: true }
      - { name: image, label: Obraz, type: image, required: true }
      - name: blocks
        label: Treść artykułu
        type: object
        list: true
        fields:
          - { name: heading, label: Śródtytuł, type: string }
          - { name: text, label: Akapit, type: text, required: true }
